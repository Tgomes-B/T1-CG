<!DOCTYPE html>
<html>
<head>
    <title>First Person</title>
    <link rel="shortcut icon" href="../favicon.ico">
    <link rel="stylesheet" href="T1.css">
    <link rel="stylesheet" href="../html/resources/default.css">
    <link rel="stylesheet" href="../html/resources/menuFirstPerson.css">    
    <meta name="viewport" content="width=device-width, initial-scale=1">  
</head>

<body>
  <div id="loadingScreen" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#111;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;">
    <div class="spinner"></div>
    <span style="color:#fff;margin-top:20px;font-size:2em;">Carregando...</span>
  </div>
  <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>  
  <script type="importmap"> 
    {"imports": {"three": "../build/three.module.js"}} 
  </script> 

  <div id="blocker" class="w3-display-container">
    <div id="instructions" class="w3-display-middle w3-center w3-white w3-opacity">
        <h1>Instructions</h1>
        <p>Move: WASD</p>
        <p>Look: Mouse</p>
        <p>Fly up: SPACE</p>
        <p>Go down: SHIFT</p>
        <p>(Click to continue)</p>
    </div>
  </div>
  <!-- Doom HUD -->
<div id="hud">
  <img id="player-face" src="images/image.png" width="64" height="64">
  <div id="health-bar">
    <div id="health"></div>
  </div>
  <div id="ammo">Ammo: 30</div>
</div>

  <div id="webgl-output">    
    <script src="../libs/other/ammo.wasm.js"></script>   
    <script type="module" src="primeiraPessoa.js"></script>
    <script type="module" src="tiro.js"></script>
    <script type="module" src="Ambiente.js"></script>
    <script type="module" src="colisao.js"></script>
  </div>
</body>
</html>
