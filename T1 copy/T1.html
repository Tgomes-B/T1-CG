<!DOCTYPE html>
<html>
<head>
    <title>First Person</title>
    <link rel="shortcut icon" href="../favicon.ico">
    <link rel="stylesheet" href="T1.css">
    <link rel="stylesheet" href="../html/resources/default.css">
    <link rel="stylesheet" href="../html/resources/menuFirstPerson.css">    
    <meta name="viewport" content="width=device-width, initial-scale=1">  
</head>

<body>
  <div id="loadingScreen" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#111;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;">
    <div class="spinner"></div>
    <span style="color:#fff;margin-top:20px;font-size:2em;">Carregando...</span>
  </div>
  <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>  
  <script type="importmap"> 
    {"imports": {"three": "../build/three.module.js"}} 
  </script> 

  <div id="blocker" class="w3-display-container">
    <div id="instructions"
         class="w3-display-middle w3-center w3-white w3-opacity"
         style="display: flex; align-items: center; justify-content: center; background: url('images/InstruBack.jpg'); background-size: cover; background-position: center; border-radius: 30px; padding: 60px 80px; min-width: 700px; min-height: 350px; box-shadow: 0 0 40px #000a;">
      <div style="flex:1; min-width: 320px;">
        <h1 style="font-size:2.5em;">Instructions</h1>
        <p style="font-size:1.3em;">Move: WASD</p>
        <p style="font-size:1.3em;">Look: Mouse</p>
        <p style="font-size:1.3em;">Jump: SPACE</p>
        <p style="font-size:1.3em;">Run: SHIFT</p>
        <p style="font-size:1.2em;">(Click to continue)</p>
      </div>
      <img src="images/tela.jpg"
           alt="End"
           style="flex:1; max-width: 320px; max-height: 320px; margin-left: 60px; border-radius: 20px; box-shadow: 0 0 20px #0008;">
    </div>
  </div>
  <!-- Doom HUD -->
<div id="hud">
  <img id="player-face" src="images/image.png" width="64" height="64">
  <div id="health-bar">
    <div id="health"></div>
  </div>
</div>

  <div id="webgl-output">    
    <script src="../libs/other/ammo.wasm.js"></script>   
    <script type="module" src="primeiraPessoa.js"></script>
    <script type="module" src="tiro.js"></script>
    <script type="module" src="Ambiente.js"></script>
    <script type="module" src="colisao.js"></script>
  </div>
</body>
</html>
